# Auto Shorts Generator Configuration

# Script Generation Settings
script_generation:
  max_length: 150  # words
  tone: "engaging"
  topics:
    - "mind-blowing facts"
    - "science explanations"
    - "psychology tricks"
    - "weird phenomena"
    - "life hacks"
    - "history mysteries"
  trending_keywords: true

# Video Settings
video:
  resolution: "1080x1920"  # Vertical for Shorts
  fps: 24
  duration: 60  # seconds (max for Shorts)
  format: "mp4"

# Audio Settings
audio:
  provider: "gtts"  # google text-to-speech (free)
  language: "en"
  speed: 1.0
  sample_rate: 44100

# Subtitle Settings
subtitles:
  font_size: 60
  font_color: "white"
  outline_color: "black"
  outline_width: 3
  position: "bottom"
  animation: "fade"  # fade, slide, typewriter

# Background/Footage Settings
background:
  source: "pexels"  # free stock footage
  search_terms: "abstract, science, space, nature"
  blur_effect: true
  opacity: 0.7

# Upload Settings
upload:
  platform: "youtube"
  playlist_id: ""  # optional
  schedule: "daily"
  time: "10:00"  # 24-hour format
  description_template: "Mind-blowing fact! 🤯\n\nSubscribe for more amazing shorts!\n\nGenerated by Auto Shorts Generator"
  tags:
    - "shorts"
    - "facts"
    - "viral"
    - "science"
    - "educational"

# Processing Settings
processing:
  max_retries: 3
  output_directory: "./output"
  keep_temp_files: false
  batch_size: 5
